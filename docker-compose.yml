version: '3.9'

services:
  # ============================================================================
  # GATEWAY (Main API & Orchestration)
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: kalighost-gateway
    ports:
      - "8000:8000"
      - "8001:8001"  # WebSocket
    environment:
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - LOG_LEVEL=INFO
      - WORKERS=4
      - MEMORY_DIR=/data/memory
      - SKILLS_DIR=/data/skills
    volumes:
      - kalighost_data:/data
      - kalighost_memory:/root/.kalighost/memory
      - ./config:/app/config:ro
      - ./skills:/app/skills:ro
    networks:
      - kalighost_net
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # SANDBOX (Code Execution - Docker-in-Docker)
  # ============================================================================
  sandbox:
    image: docker:dind-alpine
    container_name: kalighost-sandbox
    privileged: true
    environment:
      - DOCKER_DRIVER=overlay2
    volumes:
      - sandbox_data:/var/lib/docker
      - /tmp/kalighost_sandbox:/mnt/sandbox
    networks:
      - kalighost_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ============================================================================
  # PROVISIONER (Kubernetes Pod Management)
  # ============================================================================
  provisioner:
    build:
      context: .
      dockerfile: docker/Dockerfile.provisioner
    container_name: kalighost-provisioner
    ports:
      - "9000:9000"
    environment:
      - KUBECONFIG=/root/.kube/config
      - LOG_LEVEL=INFO
    volumes:
      - provisioner_data:/data
      - ~/.kube:/root/.kube:ro
    networks:
      - kalighost_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ============================================================================
  # DATABASE (PostgreSQL - Primary Data Store)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kalighost-postgres
    environment:
      - POSTGRES_DB=kalighost
      - POSTGRES_USER=${DB_USER:-kalighost}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - kalighost_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kalighost}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ============================================================================
  # CACHE (Redis - Session & Memory Cache)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: kalighost-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - kalighost_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ============================================================================
  # MONITORING (Prometheus)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kalighost-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - kalighost_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ============================================================================
  # VISUALIZATION (Grafana)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: kalighost-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - kalighost_net
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ============================================================================
  # REVERSE PROXY (Nginx)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: kalighost-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - kalighost_net
    depends_on:
      - gateway
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  kalighost_data:
    driver: local
  kalighost_memory:
    driver: local
  sandbox_data:
    driver: local
  provisioner_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_cache:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  kalighost_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
