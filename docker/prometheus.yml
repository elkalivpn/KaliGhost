global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'kalighost-gateway'
    static_configs:
      - targets: ['gateway:8000']
  
  - job_name: 'kalighost-provisioner'
    static_configs:
      - targets: ['provisioner:9000']

  - job_name: 'kalighost-postgres'
    static_configs:
      - targets: ['postgres:5432']
    
  - job_name: 'kalighost-redis'
    static_configs:
      - targets: ['redis:6379']