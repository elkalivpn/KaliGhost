version: '3.8'

# ==============================================================================
# KaliGhost Pro - Docker Compose (Production Override)
# ==============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Frontend: http://localhost:80 or https://your-domain.com
# Backend API: internal only, proxied through Nginx
# ==============================================================================

services:
  # --- PostgreSQL (Production) ---
  db:
    restart: always
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- Redis (Production) ---
  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:6379:6379"  # Only localhost

  # --- FastAPI Backend (Production) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production  # Use production stage
    restart: always
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    expose:
      - "8000"  # Only expose internally
    ports: []  # Remove public port binding
    volumes: []  # Remove volume mounts

  # --- React Frontend (Production) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production  # Use production stage with Nginx
    restart: always
    expose:
      - "80"  # Only expose internally
    ports: []  # Remove public port binding
    volumes: []  # Remove volume mounts

  # --- Nginx Reverse Proxy (Production) ---
  proxy:
    image: nginx:alpine
    container_name: kali-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates (uncomment if using Let's Encrypt)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - kali-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================================
# Secrets (for sensitive data in production)
# ==============================================================================
secrets:
  db_password:
    file: ./secrets/db_password.txt
    # Or use: external: true

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  pgdata:
    driver: local
