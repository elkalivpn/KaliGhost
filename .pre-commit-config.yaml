# Pre-commit configuration for KaliGhost Pro
# Professional code quality and security checks

repos:
  # Professional code formatting
  - repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
      - id: black
        name: Professional Code Formatter (Black)
        description: Formats Python code according to professional standards
        language_version: python3.9
        types: [python]
        exclude: ^(venv|build|dist)/

  # Professional import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: Professional Import Sorter
        description: Sorts Python imports according to PEP 8
        language_version: python3.9
        types: [python]
        exclude: ^(venv|build|dist)/

  # Professional code linting
  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        name: Professional Code Linter (Flake8)
        description: Checks Python code against style guide violations
        language_version: python3.9
        types: [python]
        exclude: ^(venv|build|dist)/
        additional_dependencies: [
          "flake8-bugbear",
          "flake8-comprehensions",
          "flake8-docstrings",
          "flake8-quotes"
        ]

  # Professional type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.0.0
    hooks:
      - id: mypy
        name: Professional Type Checker (MyPy)
        description: Static type checking for Python code
        language_version: python3.9
        types: [python]
        exclude: ^(venv|build|dist|tests)/
        args: [--config-file=mypy.ini]

  # Professional security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.0
    hooks:
      - id: bandit
        name: Professional Security Scanner (Bandit)
        description: Finds common security issues in Python code
        language_version: python3.9
        types: [python]
        exclude: ^(venv|build|dist|tests)/
        args: [-c, bandit.yaml, -r]

  # Professional file validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
        name: YAML File Validator
        description: Checks YAML files for syntax errors
      - id: check-json
        name: JSON File Validator
        description: Checks JSON files for syntax errors
      - id: trailing-whitespace
        name: Trailing Whitespace Remover
        description: Removes trailing whitespace from files
        types: [text]
      - id: end-of-file-fixer
        name: End of File Fixer
        description: Ensures files end with a newline
        types: [text]
      - id: check-added-large-files
        name: Large File Checker
        description: Prevents giant files from being committed
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Merge Conflict Detector
        description: Detects merge conflict strings
      - id: detect-private-key
        name: Private Key Detector
        description: Detects private keys in files

  # Professional documentation checks
  - repo: https://github.com/PyCQA/doc8
    rev: v1.1.1
    hooks:
      - id: doc8
        name: Professional Documentation Style Checker
        description: Checks documentation style and formatting
        files: \.(rst|md)$
        exclude: ^(venv|build|dist)/

# Professional configuration settings
default_language_version:
  python: python3.9

default_stages: [commit, push]

minimum_pre_commit_version: 2.9.0

ci:
  autofix_prs: true
  autoupdate_schedule: weekly
  skip: []
  submodules: false