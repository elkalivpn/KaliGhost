# KaliGhost Pro Professional Build Configuration

## Build Settings

[build]
name = "KaliGhost Pro"
version = "2.0.0"
description = "Professional Cyberpunk 3D Pentesting Interface"
author = "KaliGhost Team"
license = "SEE LICENSE IN LICENSE"

[python]
version = ">=3.9"
target = "3.9"

[directories]
source = "src"
build = "build"
dist = "dist"
assets = "assets"
docs = "docs"
tests = "tests"
scripts = "scripts"
config = "config"

[packages]
include = [
    "gui",
    "gui.*",
    "core",
    "core.*",
    "utils",
    "utils.*"
]
exclude = [
    "tests",
    "tests.*",
    "benchmarks",
    "benchmarks.*"
]

## Professional Dependencies

[dependencies]
runtime = [
    "PySide6>=6.5.0",
    "PyOpenGL>=3.1.6",
    "PyOpenGL-accelerate>=3.1.6",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "requests>=2.28.0"
]

development = [
    "pytest>=7.2.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.1.0",
    "mypy>=1.0.0",
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0"
]

optional = [
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pandas>=1.5.0"
]

## Build Process

[build.process]
optimize = true
strip = true
compile = true
sign = false  # Professional signing in CI/CD

[build.optimization]
level = "aggressive"
lto = true
upx = false  # Not compatible with security software

[build.packaging]
format = ["wheel", "sdist"]
compress = true
checksum = true

## Professional Testing Configuration

[testing]
unit_coverage = 90
integration_coverage = 85
system_coverage = 80
performance_benchmark = true

[testing.pytest]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests",
    "professional: marks tests as professional quality tests"
]

[testing.coverage]
omit = [
    "tests/*",
    "*/venv/*",
    "*/.venv/*",
    "setup.py"
]

## Documentation Build

[documentation]
source = "docs"
build = "docs/_build"
format = ["html", "pdf"]

[documentation.sphinx]
project = "KaliGhost Pro Professional Documentation"
author = "KaliGhost Team"
version = "2.0.0"
release = "2.0.0"

[documentation.themes]
html_theme = "sphinx_rtd_theme"
pdf_theme = "manual"

## Security Build Settings

[security]
static_analysis = true
dependency_check = true
vulnerability_scan = true
signature_verification = true

[security.scanners]
bandit = true
safety = true
pip_audit = true

[security.signing]
enabled = true
key_ring = "professional"
timestamp_authority = "http://timestamp.digicert.com"

## Professional Deployment

[deployment]
targets = ["pypi", "github", "enterprise"]
channels = ["stable", "beta", "nightly"]

[deployment.pypi]
repository = "pypi"
username = "__token__"
password_env = "PYPI_TOKEN"

[deployment.github]
owner = "elkalivpn"
repo = "KaliGhost"
release_draft = true

[deployment.enterprise]
internal_repo = "https://internal.company.com/pypi"
auth_required = true

## CI/CD Integration

[ci]
pipeline_stages = ["test", "build", "security", "deploy"]
parallel_jobs = 4
timeout_minutes = 60

[ci.matrix]
os = ["ubuntu-latest", "macos-latest", "windows-latest"]
python_versions = ["3.9", "3.10", "3.11"]

[ci.notifications]
slack_webhook_env = "SLACK_WEBHOOK_URL"
email_recipients = ["dev-team@kalighost.pro", "security@kalighost.pro"]
failure_only = false

## Professional Quality Gates

[quality.gates]
test_coverage = 90
security_violations_critical = 0
security_violations_high = 0
security_violations_medium = 5
code_complexity_max = 10
duplicate_code_threshold = 5

[quality.metrics]
maintainability_index = 80
cyclomatic_complexity = 5
halstead_volume = 1000

## Professional Performance Benchmarks

[performance.benchmarks]
startup_time_ms = 5000
rendering_fps_min = 60
memory_usage_mb = 500
cpu_usage_percent = 30

[performance.profiling]
enabled = true
output_dir = "profiling"
format = ["pstats", "json"]

## Compliance and Standards

[compliance]
licenses_check = true
copyright_headers = true
accessibility_standards = ["WCAG21AA"]
security_standards = ["OWASP", "NIST", "CIS"]

[compliance.reporting]
generate_reports = true
report_formats = ["html", "pdf", "json"]
output_dir = "compliance_reports"

## Professional Asset Processing

[assets.processing]
optimize_images = true
compress_textures = true
minify_css_js = true
generate_previews = true

[assets.optimization]
image_quality = 85
texture_compression = "BC7"
css_minifier = "cssnano"
js_minifier = "terser"

## Internationalization

[i18n]
languages = ["en", "es", "fr", "de", "ja", "zh"]
default_language = "en"
translation_service = "professional"

[i18n.extraction]
source_patterns = ["src/**/*.py", "src/**/*.ui"]
output_dir = "locale"
format = "po"

## Professional Support and Maintenance

[support]
issue_tracker = "https://github.com/elkalivpn/KaliGhost/issues"
documentation = "https://docs.kalighost.pro"
community_forum = "https://community.kalighost.pro"

[support.enterprise]
sla_response_time = "24h"
support_channels = ["email", "phone", "chat"]
dedicated_engineer = true

## Version Control Integration

[vc]
tag_format = "v{version}"
commit_message = "Release version {version}"
changelog_update = true

[vc.git]
sign_commits = true
sign_tags = true
verify_signatures = true

## Professional Backup and Recovery

[backup]
automatic_backups = true
retention_days = 90
encryption_required = true

[backup.locations]
primary = "s3://kalighost-backups/prod"
secondary = "gs://kalighost-dr/prod"
encrypted = true

## Professional Monitoring and Observability

[monitoring]
error_tracking = true
performance_monitoring = true
user_analytics = false  # Privacy-focused

[monitoring.services]
sentry_dsn_env = "SENTRY_DSN"
datadog_api_key_env = "DATADOG_API_KEY"
newrelic_license_env = "NEWRELIC_LICENSE_KEY"

## Professional Logging Configuration

[logging]
level = "INFO"
format = "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
max_file_size = "10MB"
backup_count = 5

[logging.handlers]
console = true
file = true
syslog = false

[logging.security]
separate_file = true
level = "WARNING"
encrypt_logs = true