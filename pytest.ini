# Pytest configuration for KaliGhost Pro
# Professional testing framework

[tool:pytest]
# Professional test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Professional test execution
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --html=reports/test-report.html
    --self-contained-html
    --benchmark-skip

# Professional markers
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    security: marks tests as security tests
    performance: marks tests as performance tests
    professional: marks tests as professional quality tests
    gui: marks tests that require GUI components
    network: marks tests that require network access
    hardware: marks tests that require specific hardware

# Professional filtering
norecursedirs = 
    .git
    .tox
    .env
    dist
    build
    venv
    node_modules

# Professional junit configuration
junit_family = xunit2

# Professional coverage configuration
[coverage:run]
source = src
omit = 
    */venv/*
    */tests/*
    */build/*
    */dist/*
    setup.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[coverage:html]
directory = reports/coverage-html

[coverage:xml]
output = reports/coverage.xml