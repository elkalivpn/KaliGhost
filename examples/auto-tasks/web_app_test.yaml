# Web App Pentest – Ejemplo AUTO task
task:
  name: "owasp_top10_scan"
  description: "Testing OWASP Top 10 contra app web"
  agent_mode: "AUTO"
  target: "http://target.com"
  steps:
    - tool: nuclei
      args: ["-u", "$target", "-t", "~/nuclei-templates"]
    - tool: sqlmap
      args: ["-u", "$target", "--batch", "--level=5"]
    - tool: zap_baseline
      args: ["-t", "$target"]
  report:
    format: "html"
    send_to: "pentester@example.com"