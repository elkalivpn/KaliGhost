# Red Scan – Ejemplo AUTO task
task:
  name: "full_network_audit"
  description: "Escaneo completo de red 192.168.1.0/24"
  agent_mode: "AUTO"
  steps:
    - tool: nmap
      args: ["-sS", "-sV", "-O", "192.168.1.0/24"]
      timeout: 300
    - tool: metasploit
      module: "auxiliary/scanner/ssh/ssh_version"
      on_success: true
    - tool: custom_script
      path: "scripts/analyze_open_ports.py"
      args: ["--input", "nmap_results.xml"]
  output:
    format: "pdf"
    path: "/root/work/reports/network_audit.pdf"