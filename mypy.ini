# MyPy configuration for KaliGhost Pro
# Professional static type checking

[mypy]
# Professional type checking settings
python_version = 3.9
platform = linux

# Professional strictness options
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

# Professional error formatting
show_column_numbers = True
show_error_codes = True
show_error_context = True
pretty = True

# Professional import discovery
mypy_path = src
explicit_package_bases = True
namespace_packages = True

# Professional module configuration
[mypy-gui.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True

[mypy-core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True

[mypy-utils.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True

[mypy-tests.*]
disallow_untyped_defs = False
allow_untyped_globals = True
disable_error_code = attr-defined

# Professional third-party library configuration
[mypy-PySide6.*]
ignore_missing_imports = True

[mypy-PyOpenGL.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

# Professional build and distribution directories
[mypy-build.*]
ignore_errors = True

[mypy-dist.*]
ignore_errors = True

[mypy-venv.*]
ignore_errors = True

# Professional configuration files
[mypy-setup]
ignore_errors = True

[mypy-conftest]
ignore_errors = True