# 🐉 KaliGhost 3.0 - Complete Configuration File
# Fully customizable system for all behaviors, models, agents, and workflows

# ============================================================================
# CORE ENGINE CONFIGURATION
# ============================================================================

core:
  # Application name and identity
  app_name: "KaliGhost 3.0"
  version: "3.0.0"
  description: "Elite Developer Agentic Environment"
  
  # Execution mode
  mode: "production"  # Options: development, staging, production
  debug: false
  
  # Logging
  logging:
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    format: "json"  # json, text, structured
    file: "logs/kalighost.log"
    max_size_mb: 100
    backup_count: 10

# ============================================================================
# AGENT CONFIGURATION
# ============================================================================

agents:
  # Global agent settings
  defaults:
    timeout_seconds: 300
    max_retries: 3
    temperature: 0.7  # 0.0-1.0, lower = deterministic, higher = creative
    top_p: 0.9
    max_tokens: 4096
    
  # Individual agent customization
  orchestrator:
    enabled: true
    model: "gpt-4"
    temperature: 0.5
    system_prompt: |
      You are the Orchestrator Agent. Your role is to decompose complex tasks into 
      manageable sub-tasks and assign them to specialized agents.
      
      Guidelines:
      - Break down tasks into logical steps
      - Assign each step to the most suitable agent
      - Monitor progress and adapt as needed
      - Return comprehensive results
    max_sub_tasks: 20
    timeout_seconds: 600
    
  security_agent:
    enabled: true
    model: "gpt-4"
    temperature: 0.3
    system_prompt: |
      You are the Security Hardening Agent. Your role is to identify and remediate
      security vulnerabilities in code.
      
      Guidelines:
      - Perform thorough security analysis
      - Identify OWASP Top 10 vulnerabilities
      - Suggest secure implementations
      - Generate remediation code
    tools:
      - semgrep
      - bandit
      - trivy
    auto_remediate: true
    severity_threshold: "medium"  # low, medium, high, critical
    
  monetization_agent:
    enabled: true
    model: "gpt-3.5-turbo"
    temperature: 0.6
    system_prompt: |
      You are the Monetization Agent. Your role is to design and implement
      monetization strategies and licensing systems.
      
      Guidelines:
      - Design flexible pricing models
      - Generate license keys
      - Track usage metrics
      - Recommend upsell opportunities
    stripe_enabled: true
    licensing_enabled: true
    
  threat_agent:
    enabled: true
    model: "gpt-4"
    temperature: 0.4
    system_prompt: |
      You are the Threat Intelligence Agent. Your role is to assess security threats
      and vulnerabilities.
      
      Guidelines:
      - Collect OSINT data
      - Assess threat levels
      - Monitor dark web mentions
      - Generate threat reports
    dark_web_monitoring: true
    osint_sources:
      - shodan
      - censys
      - exploit-db
    update_frequency_hours: 6
    
  infrastructure_agent:
    enabled: true
    model: "gpt-3.5-turbo"
    temperature: 0.5
    system_prompt: |
      You are the Infrastructure Agent. Your role is to provision and manage
      cloud infrastructure and auto-scaling.
      
      Guidelines:
      - Provision cloud resources
      - Configure auto-scaling
      - Manage secrets
      - Optimize costs
    cloud_providers:
      aws:
        enabled: true
        default_region: "us-east-1"
      digitalocean:
        enabled: true
        default_region: "nyc1"
    auto_scaling_enabled: true
    
  compliance_agent:
    enabled: true
    model: "gpt-4"
    temperature: 0.3
    system_prompt: |
      You are the Compliance & Ethics Agent. Your role is to ensure applications
      meet legal and ethical standards.
      
      Guidelines:
      - Generate compliance documentation
      - Check ethical implications
      - Verify regulatory compliance
      - Flag potential issues
    standards:
      - GDPR
      - HIPAA
      - SOC2
      - CCPA
    ethics_review: true

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================

models:
  # Primary LLM configuration
  primary:
    provider: "openai"  # openai, anthropic, azure, local
    api_key: "${OPENAI_API_KEY}"
    model_name: "gpt-4"
    api_version: "2024-05-01"
    base_url: "https://api.openai.com/v1"
    timeout_seconds: 60
    max_retries: 3
    
  # Fallback models
  fallback:
    - provider: "openai"
      model_name: "gpt-3.5-turbo"
    - provider: "anthropic"
      model_name: "claude-opus"
      
  # Local models (optional)
  local_models:
    enabled: false
    model_dir: "./models"
    models:
      - name: "mistral-7b"
        type: "llamacpp"
      - name: "neural-chat"
        type: "transformers"
        
  # Embeddings configuration
  embeddings:
    provider: "openai"
    model: "text-embedding-3-small"
    dimension: 1536

# ============================================================================
# WORKFLOW CONFIGURATION
# ============================================================================

workflows:
  # Dynamic workflow definitions
  default_workflow: "full_stack_development"
  
  # Workflow execution settings
  execution:
    parallel_tasks: true
    max_concurrent: 5
    timeout_per_task: 300
    retry_failed_tasks: true
    save_history: true
    
  # Custom workflows
  custom:
    full_stack_development:
      name: "Full Stack Development"
      description: "Build complete applications"
      steps:
        - id: "analyze"
          agent: "orchestrator"
          prompt: "Analyze requirements"
        - id: "plan"
          agent: "orchestrator"
          prompt: "Create development plan"
        - id: "implement"
          agent: "infrastructure_agent"
          prompt: "Set up infrastructure"
        - id: "secure"
          agent: "security_agent"
          prompt: "Harden security"
        - id: "monetize"
          agent: "monetization_agent"
          prompt: "Add monetization"
        - id: "deploy"
          agent: "infrastructure_agent"
          prompt: "Deploy to production"
          
    microservices_deployment:
      name: "Microservices Deployment"
      description: "Deploy microservices architecture"
      steps:
        - id: "design"
          agent: "orchestrator"
          prompt: "Design microservices"
        - id: "containerize"
          agent: "infrastructure_agent"
          prompt: "Create Docker containers"
        - id: "orchestrate"
          agent: "infrastructure_agent"
          prompt: "Setup Kubernetes"
          
    security_audit:
      name: "Security Audit"
      description: "Complete security assessment"
      steps:
        - id: "scan"
          agent: "security_agent"
          prompt: "Scan for vulnerabilities"
        - id: "threat_assess"
          agent: "threat_agent"
          prompt: "Assess threats"
        - id: "compliance_check"
          agent: "compliance_agent"
          prompt: "Check compliance"
        - id: "report"
          agent: "orchestrator"
          prompt: "Generate report"

# ============================================================================
# IDENTITY & BRANDING
# ============================================================================

identity:
  # Application identity
  brand_name: "KaliGhost"
  brand_color: "#00ff00"  # Dragon green
  brand_emoji: "🐉"
  
  # Custom prompts for all interactions
  system_prompt_template: |
    You are {agent_name}, part of the KaliGhost 3.0 system.
    Your expertise: {expertise}
    Your role: {role}
    
    Always be:
    - Professional and precise
    - Security-conscious
    - Compliance-aware
    - User-focused
    
    Current context: {context}
    
  # Welcome message
  welcome_message: |
    🐉 Welcome to KaliGhost 3.0
    Elite Developer Agentic Environment
    
    I'm here to help you build, secure, and scale applications.
    
  # Error messages
  error_messages:
    default: "An error occurred. Please try again."
    timeout: "Operation timed out. Increasing timeout..."
    security_violation: "Security constraint violated. Action blocked."
    
  # Success messages
  success_messages:
    task_complete: "✅ Task completed successfully"
    deployment_ready: "🚀 Ready for deployment"

# ============================================================================
# MEMORY & PERSISTENCE
# ============================================================================

memory:
  # Database configuration
  database:
    type: "sqlite"  # sqlite, postgresql, mongodb
    connection_string: "sqlite:///./kalighost_memory.db"
    
  # For PostgreSQL
  postgresql:
    host: "localhost"
    port: 5432
    database: "kalighost"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
    
  # Memory settings
  retention_days: 30
  auto_cleanup: true
  compress_old_entries: true
  
  # Caching (Redis)
  cache:
    enabled: true
    provider: "redis"
    url: "redis://localhost:6379"
    ttl_seconds: 3600
    max_memory_mb: 512

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================

security:
  # Authentication
  auth:
    method: "jwt"  # jwt, oauth2, api_key
    jwt_secret: "${JWT_SECRET}"
    jwt_algorithm: "HS256"
    token_expiry_hours: 24
    
  # Encryption
  encryption:
    algorithm: "AES-256-GCM"
    key: "${ENCRYPTION_KEY}"
    
  # API Security
  api:
    rate_limit: 1000  # requests per hour
    cors_origins: ["*"]
    require_https: true
    enable_cors: true
    
  # Secrets management
  secrets:
    provider: "vault"  # vault, aws_secrets_manager, .env
    vault_addr: "http://localhost:8200"
    vault_token: "${VAULT_TOKEN}"
    
  # Code execution sandbox
  sandbox:
    enabled: true
    type: "docker"  # docker, kubernetes
    timeout_seconds: 300
    memory_limit_mb: 2048
    cpu_limit: 2
    network_access: false

# ============================================================================
# PERFORMANCE & OPTIMIZATION
# ============================================================================

performance:
  # Caching
  cache:
    enabled: true
    ttl_seconds: 3600
    max_size_mb: 1024
    
  # Connection pooling
  connection_pool:
    min_size: 5
    max_size: 20
    
  # Request batching
  batching:
    enabled: true
    batch_size: 10
    batch_timeout_seconds: 5
    
  # Async execution
  async:
    enabled: true
    worker_threads: 10
    
  # Monitoring
  monitoring:
    enabled: true
    metrics_port: 9090
    trace_enabled: true

# ============================================================================
# INTEGRATION CONFIGURATION
# ============================================================================

integrations:
  # Payment processing
  stripe:
    enabled: true
    api_key: "${STRIPE_API_KEY}"
    webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
    api_version: "2024-01-01"
    
  # Communication channels
  channels:
    telegram:
      enabled: true
      token: "${TELEGRAM_BOT_TOKEN}"
    slack:
      enabled: true
      token: "${SLACK_BOT_TOKEN}"
    feishu:
      enabled: false
      token: "${FEISHU_TOKEN}"
    wechat:
      enabled: false
      token: "${WECHAT_TOKEN}"
      
  # Cloud providers
  aws:
    enabled: true
    access_key: "${AWS_ACCESS_KEY}"
    secret_key: "${AWS_SECRET_KEY}"
    region: "us-east-1"
    
  # Version control
  github:
    enabled: true
    token: "${GITHUB_TOKEN}"
    org: "your-org"
    
  # Monitoring
  sentry:
    enabled: true
    dsn: "${SENTRY_DSN}"

# ============================================================================
# UI/UX CONFIGURATION
# ============================================================================

ui:
  # WebChat settings
  webchat:
    enabled: true
    port: 8001
    theme: "dark"  # dark, light, custom
    language: "en"  # en, es, fr, de, zh, ja
    
  # 3D Dragon UI
  dragon:
    enabled: true
    animation_speed: 1.0  # 0.5-2.0
    interactive: true
    
  # CLI settings
  cli:
    colors: true
    verbose: true
    table_format: "pretty"  # pretty, plain, json, csv

# ============================================================================
# DEPLOYMENT CONFIGURATION
# ============================================================================

deployment:
  # Environment
  environment: "production"
  
  # Docker
  docker:
    enabled: true
    registry: "docker.io"
    image_name: "kalighost"
    image_tag: "latest"
    
  # Kubernetes
  kubernetes:
    enabled: true
    namespace: "kalighost"
    replicas: 3
    
  # CI/CD
  cicd:
    enabled: true
    platform: "github_actions"  # github_actions, gitlab_ci, jenkins
    
  # Auto-scaling
  autoscaling:
    enabled: true
    min_replicas: 1
    max_replicas: 10
    target_cpu_percent: 70

# ============================================================================
# FEATURE FLAGS
# ============================================================================

features:
  # Agent features
  agents:
    orchestrator_enabled: true
    security_hardening: true
    monetization: true
    threat_intelligence: true
    infrastructure_automation: true
    gui_generation: true
    compliance_checking: true
    im_integration: true
    
  # Advanced features
  advanced:
    multi_agent_collaboration: true
    autonomous_decision_making: true
    self_healing: true
    predictive_scaling: true
    
  # Experimental
  experimental:
    web3_integration: false
    ml_threat_detection: false
    autonomous_coding: false

# ============================================================================
# DEVELOPMENT SETTINGS
# ============================================================================

development:
  # Debug mode
  debug_mode: false
  verbose_logging: false
  
  # Testing
  testing:
    enabled: false
    mock_responses: false
    test_data_dir: "./test_data"
    
  # Hot reload
  hot_reload: false
  
  # API documentation
  api_docs:
    enabled: true
    swagger_ui: true
    redoc: true
